whole_body_control:
    update_rate: {       
        type: int,
        default_value: 1000,
        description: "Control update rate in Hz",
        validation: {
            gt<>: [0.0]
        }
    }
    joint_names: {
        type: string_array,
        default_value: [],
        description: "This array defines the order of joints used in the solver output.",
        validation: {
            unique<>: null,
            fixed_size<>: [20]
        }
    }
    robot_description: {
        type: string,
        default_value: "",
        description: "Robot URDF string.",
        validation: {
            not_empty<>: null
        }
    }
    joint_weights: {
        type: double_array,
        default_value: [],
        description: "The joint weights control the contribution of each individual joint to the solution. Values have to be within [0,1].
                      The smaller a value, the less the contribution of a joint. A zero means here that the joint is not used at all. 
                      Size has to be same as number of robot joints.",
        validation: {
            not_empty<>: null,    
            fixed_size<>: [20]    
        }
    }
    p_gain: {
        type: double_array, 
        default_value: [],
        description: "P-Gains for the low-level PD controller. These are sent along with the solver output to the motor drivers. Size has to be same \
                        as the number of joints. Order is the same as in joint_names property.",
        validation: {
            not_empty<>: null,
            lower_element_bounds<>: [0.0],    
            fixed_size<>: [20]  
        }
    }
    d_gain: {
        type: double_array, 
        default_value: [],
        description: "D-Gains for the low-level PD controller. These are sent along with the solver output to the motor drivers. Size has to be same \
                        as the number of joints. Order is the same as in joint_names property.",
        validation: {
            not_empty<>: null,
            lower_element_bounds<>: [0.0],    
            fixed_size<>: [20]  
        }
    }
    tasks:
        body_pose:
            weights: {
                type: double_array,
                default_value: [],
                description: "Initial weights for this task. Size has to be 6. \ 
                              All entries have to be >= 0.  Can be used to balance contributions of the task variables.\
                              A value of 0 means that the reference of the corresponding task variable will be ignored while computing the solution.",
                validation: {
                    not_empty<>: null,
                    lower_element_bounds<>: [0.0],
                    fixed_size<>: 6
                }
            }
            tip_frame: {
                type: string,
                default_value: "",
                description: "Tip frame of the kinematic chain associated with this task. Has to be the name of a valid link in the robot model.",
            }   
            p_gain: {
                type: double_array,
                default_value: [],
                description: "Array of proportional gain values, size has to be 6",
                validation: {
                    not_empty<>: null,
                    fixed_size<>: 6
                }
            }   
            d_gain: {
                type: double_array,
                default_value: [],
                description: "Array of derivative gain values, size has to be 6",
                validation: {
                    not_empty<>: null,
                    fixed_size<>: 6
                }
            }
        foot_r_pose:
            weights: {
                type: double_array,
                default_value: [],
                description: "Initial weights for this task. Size has to be 6. \ 
                              All entries have to be >= 0.  Can be used to balance contributions of the task variables.\
                              A value of 0 means that the reference of the corresponding task variable will be ignored while computing the solution.",
                validation: {
                    not_empty<>: null,
                    lower_element_bounds<>: [0.0],
                    fixed_size<>: 6
                }
            }
            tip_frame: {
                type: string,
                default_value: "",
                description: "Tip frame of the kinematic chain associated with this task. Has to be the name of a valid link in the robot model.",
            }
            p_gain: {
                type: double_array,
                default_value: [],
                description: "Array of proportional gain values, size has to be 6",
                validation: {
                    not_empty<>: null,
                    fixed_size<>: 6
                }
            }
            d_gain: {
                type: double_array,
                default_value: [],
                description: "Array of derivative gain values, size has to be 6",
                validation: {
                    not_empty<>: null,
                    fixed_size<>: 6
                }
            }
        foot_l_pose:
            weights: {
                type: double_array,
                default_value: [],
                description: "Initial weights for this task. Size has to be 6. \ 
                              All entries have to be >= 0.  Can be used to balance contributions of the task variables.\
                              A value of 0 means that the reference of the corresponding task variable will be ignored while computing the solution.",
                validation: {
                    not_empty<>: null,
                    lower_element_bounds<>: [0.0],
                    fixed_size<>: 6
                }
            }
            tip_frame: {
                type: string,
                default_value: "",
                description: "Tip frame of the kinematic chain associated with this task. Has to be the name of a valid link in the robot model.",
            }
            p_gain: {
                type: double_array,
                default_value: [],
                description: "Array of proportional gain values, size has to be 6",
                validation: {
                    not_empty<>: null,
                    fixed_size<>: 6
                }
            }    
            d_gain: {
                type: double_array,
                default_value: [],
                description: "Array of derivative gain values, size has to be 6",
                validation: {
                    not_empty<>: null,
                    fixed_size<>: 6
                }
            }
        contact_force_r:
            weights: {
                type: double_array,
                default_value: [],
                description: "Initial weights for this task. Size has to be 6. \ 
                              All entries have to be >= 0.  Can be used to balance contributions of the task variables.\
                              A value of 0 means that the reference of the corresponding task variable will be ignored while computing the solution.",
                validation: {
                    not_empty<>: null,
                    lower_element_bounds<>: [0.0],
                    fixed_size<>: 6
                }
            }
        contact_force_l:
            weights: {
                type: double_array,
                default_value: [],
                description: "Initial weights for this task. Size has to be 6. \ 
                              All entries have to be >= 0.  Can be used to balance contributions of the task variables.\
                              A value of 0 means that the reference of the corresponding task variable will be ignored while computing the solution.",
                validation: {
                    not_empty<>: null,
                    lower_element_bounds<>: [0.0],
                    fixed_size<>: 6
                }
            }
        joint_position:
            weights: {
                type: double_array,
                default_value: [],
                description: "Initial weights for this task. Size has to be same as number of joints. \ 
                              All entries have to be >= 0.  Can be used to balance contributions of the task variables.\
                              A value of 0 means that the reference of the corresponding task variable will be ignored while computing the solution.",
                validation: {
                    not_empty<>: null,    
                    fixed_size<>: [20]  
                }
            }
            p_gain: {
                type: double_array,
                default_value: [],
                description: "Array of proportional gain values, size has to be same as number of joints",
                validation: {
                    not_empty<>: null,    
                    fixed_size<>: [20]  
                }
            }   
            d_gain: {
                type: double_array,
                default_value: [],
                description: "Array of derivative gain values, size has to be same as number of joints",
                validation: {
                    not_empty<>: null,    
                    fixed_size<>: [20]  
                }
            }  
    robot_model:
        type: {
            type: string,
            default_value: "pinocchio",
            description: "Robot model type. Must be the exact name of one of the registered robot model plugins. See src/robot_models for all available plugins.*/",
            validation: {
                one_of<>: [["rbdl", "pinocchio", "kdl", "hyrodyn"]],
            }
        }
        contacts:
            left_leg: 
                name: {
                    type: string,
                    default_value: "",
                    description: "Link name that can be in contact with the environment. Has to be valid link name in the robot model.",
                    validation: {
                        not_empty<>: null
                    }
                }    
                mu: {
                    type: double,
                    default_value: 0.0,
                    description: "Friction coeffcient for the contact point.",
                    validation: {
                        gt_eq<>: [0.0]
                    }
                }
                wx: {
                    type: double,
                    default_value: 0.0,
                    description: "x-dimension of the contact surface (only for surface contacts).",
                    validation: {
                        gt_eq<>: [0.0]
                    }
                }
                wy: {
                    type: double,
                    default_value: 0.0,
                    description: "y-dimension of the contact surface (only for surface contacts).",
                    validation: {
                        gt_eq<>: [0.0]
                    }
                }
            right_leg: 
                name: {
                    type: string,
                    default_value: "",
                    description: "Link name that can be in contact with the environment. Has to be valid link name in the robot model.",
                    validation: {
                        not_empty<>: null
                    }
                } 
                mu: {
                    type: double,
                    default_value: 0.0,
                    description: "Friction coeffcient for the contact point.",
                    validation: {
                        gt_eq<>: [0.0]
                    }
                }
                wx: {
                    type: double,
                    default_value: 0.0,
                    description: "x-dimension of the contact surface (only for surface contacts).",
                    validation: {
                        gt_eq<>: [0.0]
                    }
                }
                wy: {
                    type: double,
                    default_value: 0.0,
                    description: "y-dimension of the contact surface (only for surface contacts).",
                    validation: {
                        gt_eq<>: [0.0]
                    }
                }
    solver:
        type: {
            type: string,
            default_value: "qpoases",
            description: "QP Solver type. Must be the exact name of one of the registered QP solver plugins. See src/solvers for all available plugins.",
            validation: {
                one_of<>: [["qpoases", "hls", "proxqp", "qpswift", "eiquadprog", "hpipm", "osqp", "clarabel", "daqp"]],
            }
        }